# STUDY STEP 0 - ingest WAVE 2. Repeat for each wave (0_ingest_wave{1,2,3}.yaml).
#
# The wave surveys identify people by a typed StudentID, but get_responses.py
# needs a numeric TWIN_ID column. Add it first (writes a copy; the raw export is
# never modified), and fix any duplicate/blank/non-numeric IDs it reports:
#
#   python -m kli.combine_waves --add-twin-id \
#       data/study/wave2/raw_data/wave2_responses.csv \
#       data/study/wave2/raw_data/wave2_responses_twinid.csv
#
# Then:
#   python processing_qualtrics_qsf/parse_qsf.py      --config configs/study/0_ingest_wave2.yaml
#   python processing_qualtrics_csv/get_responses.py  --config configs/study/0_ingest_wave2.yaml
#   python -m kli.reconcile                           --config configs/study/0_ingest_wave2.yaml

qsf_to_json:
  input_file: data/study/wave2/raw_data/KLI_Digital_Twin_Wave2.qsf
  output_file: data/study/wave2/survey_flow.json
  exclude_blocks: null

csv_to_fill_answers:
  input_survey_template: data/study/wave2/survey_flow.json
  input_csv_file: data/study/wave2/raw_data/wave2_responses_twinid.csv
  output_dir: data/study/wave2/response_json
  limit: -1
